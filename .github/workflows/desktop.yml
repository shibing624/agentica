# Desktop installers for the Electron shell, one per platform+arch.
#
# This runs in CI and not on a laptop because it cannot run on a laptop: the
# Windows NSIS installer needs Windows (or wine) and the Linux deb/AppImage
# needs Linux (or docker), so a macOS dev box can only ever produce the two
# dmgs. Three runners is the whole reason this file exists.
#
# Each installer carries its own CPython plus the agentica and agentica-gateway
# wheels of the same commit (desktop/scripts/prepare-runtime.js), so the app
# needs no system Python or network on first launch, and shell and gateway are
# always the same version.
#
# Releases call this from release.yml (`release_artifacts: true`): it then
# installs the web-dist and python-dist artifacts that run already built, so
# the installers carry the very wheels PyPI gets, and release.yml attaches the
# installers plus the latest*.yml / blockmap files electron-updater reads.
# workflow_dispatch builds everything from the branch on its own, so the
# packaging can be exercised before a release depends on it.
#
# Signing is opt-in. With the secrets below set, macOS builds are signed and
# notarized and the Windows exe is signed; without them the build is unsigned
# (macOS quarantines it, SmartScreen warns, and macOS skips auto-update).
#   macOS:   CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
#            APPLE_TEAM_ID
#   Windows: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD
name: Desktop installers

on:
  workflow_call:
    inputs:
      release_artifacts:
        description: Use the web-dist / python-dist artifacts of the calling run
        type: boolean
        default: false
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
            runtimes: --target mac-arm64 --target mac-x64
          - os: windows-latest
            args: --win
            runtimes: --target win-x64
          - os: ubuntu-latest
            args: --linux
            runtimes: --target linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Use the release's web UI
        if: inputs.release_artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Use the release's wheels
        if: inputs.release_artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: ${{ runner.temp }}/python-dist

      - name: Point the runtime at those wheels
        if: inputs.release_artifacts
        shell: bash
        run: |
          d="$RUNNER_TEMP/python-dist"
          echo "AGENTICA_WHEEL=$(ls "$d"/agentica-*.whl)" >> "$GITHUB_ENV"
          echo "AGENTICA_GATEWAY_WHEEL=$(ls "$d"/agentica_gateway-*.whl)" >> "$GITHUB_ENV"

      # Standalone run: build the UI here; prepare-runtime.js builds both
      # wheels from this checkout (the gateway wheel's build needs web/dist).
      - name: Build the web UI
        if: ${{ !inputs.release_artifacts }}
        working-directory: web
        run: |
          npm ci
          npm run build

      - run: python -m pip install --upgrade pip wheel setuptools

      # The installers carry their own version metadata, so a tag build must
      # stamp it — otherwise every release ships an installer claiming whatever
      # desktop/package.json happened to say. `npm version` rather than sed:
      # this matrix includes macOS, whose BSD sed spells -i differently.
      - name: Stamp the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          cd desktop && npm version --no-git-tag-version --allow-same-version "$V"

      - run: npm ci
        working-directory: desktop

      - name: Assemble the bundled runtime
        working-directory: desktop
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-runtime.js ${{ matrix.runtimes }}

      - name: Build installers
        working-directory: desktop
        shell: bash
        env:
          # Without a certificate, electron-builder would hunt for a signing
          # identity in the runner's empty keychain and fail the build instead
          # of producing an unsigned app.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK == '' && 'false' || 'true' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

