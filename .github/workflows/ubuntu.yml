name: Linux build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# One job per artifact family, so a red check says which one broke. They all
# run on every push: path filters would save minutes but let a cross-package
# change (core API used by the gateway) skip the job that would catch it.
jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # agentica, agentica-gateway (and its exact pin), desktop and sdk-ts
      # release from one tag; drift here would publish a gateway that cannot
      # install next to the core it was built with.
      - run: python scripts/versions.py check

  # The SDK + CLI exactly as `pip install agentica` users get it: no FastAPI,
  # no gateway distribution. Gateway tests must skip, not error.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Smoke test latest PyPI release
        run: |
          pip install -U agentica
          cd "$RUNNER_TEMP"
          python -c "import agentica; print(agentica.__version__, agentica.__file__)"
          pip uninstall -y agentica
      - name: Install
        run: |
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio
      - name: The core does not drag the server in
        run: |
          python - <<'PY'
          import importlib.util as u
          for mod in ("fastapi", "uvicorn", "lark_oapi", "agentica_gateway"):
              assert u.find_spec(mod) is None, f"{mod} installed by plain `pip install agentica`"
          PY
          # The command still exists (uv tool installs need it) and says what to install.
          if agentica-gateway --help 2>err.txt; then echo "should have failed"; exit 1; fi
          grep -q "pip install agentica-gateway" err.txt
      - name: Guard extra-only test imports
        run: python scripts/check_bare_ci_imports.py
      - name: Run tests
        run: python -m pytest tests/ evaluation/code_benchmark/tests/ -q --tb=short

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 3

  sdk-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk-ts/package-lock.json
      - working-directory: sdk-ts
        run: |
          npm ci
          npm test

  # Both wheels and sdists, built the way a release builds them, installed
  # into a clean venv outside the checkout, then the gateway test suite.
  gateway:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            gateway/pyproject.toml
      - name: Build distributions
        run: |
          pip install build
          python -m build --outdir dist .
          python -m build --outdir dist gateway
          ls -l dist
      - name: Verify distribution contents
        run: python scripts/verify_dists.py dist
      - name: Install the built wheels outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/gw"
          "$RUNNER_TEMP/gw/bin/pip" install dist/agentica-*.whl "$(ls dist/agentica_gateway-*.whl)[all]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/gw/bin/python" - <<'PY'
          import agentica, agentica_gateway, agentica_gateway.main as m
          assert agentica.__version__ == agentica_gateway.__version__
          assert (m._UI_DIR / "index.html").is_file(), m._UI_DIR
          assert "site-packages" in str(m._UI_DIR), m._UI_DIR
          print("ok", agentica.__version__, m._UI_DIR)
          PY
          "$RUNNER_TEMP/gw/bin/agentica-gateway" --help >/dev/null
      - name: Gateway tests
        run: |
          pip install -e . -e "./gateway[all]"
          pip install pytest pytest-cov pytest-asyncio
          python -m pytest tests/gateway tests/cron -q --tb=short
