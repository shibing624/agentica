# Publish @agentica/sdk to https://registry.npmjs.org (not www.npmjs.com).
# Trigger: v* / sdk-v* tags, or Run workflow. Secret: NPM_TOKEN (npmjs user shibing624-xm).
name: Publish @agentica/sdk

on:
  push:
    tags:
      - "v*"
      - "sdk-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk-ts/package-lock.json
      - name: Install and test
        run: |
          npm ci
          npm test
      - name: Publish @agentica/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$name" != "@agentica/sdk" ]; then
            echo "refusing to publish '$name' (only @agentica/sdk is allowed)"
            exit 1
          fi
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} already on registry.npmjs.org, skip"
            exit 0
          fi
          npm publish --access public --registry https://registry.npmjs.org/
