[project]
name = "agentica-gateway"
# Lockstep with agentica: scripts/versions.py keeps this, the agentica pin
# below and agentica/version.py identical, and CI fails when they drift.
version = "1.5.0"
description = "Agentica Gateway: FastAPI server, Web UI, IM channels and cron for the agentica agent runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "XuMing", email = "xuming624@qq.com" }]
keywords = ["ai", "agent", "llm", "gateway", "web-ui", "chatbot"]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Exact pin: the gateway uses agentica internals (config, run, cron,
    # compression), not only its public API, so any other version can break.
    "agentica==1.5.0",
    "fastapi[standard]>=0.109",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "apscheduler>=3.10",
    "croniter>=1.3",
]

[project.optional-dependencies]
# IM channels. Each is imported lazily by its channel, so a missing one only
# disables that channel and logs the install command.
feishu   = ["lark-oapi>=1.0"]
telegram = ["python-telegram-bot>=20.0"]
discord  = ["discord.py>=2.0"]
slack    = ["slack_sdk>=3.40", "websocket-client>=1.6"]
qq       = ["qq-botpy>=1.0"]
wecom    = ["wecom_aibot_sdk>=0.1"]
dingtalk = ["dingtalk-stream>=0.20"]
wechat   = ["qrcode>=7.0", "requests>=2.28", "pycryptodome>=3.20", "Pillow>=10.0", "graiax-silkcoder"]
all = [
    "agentica-gateway[feishu]",
    "agentica-gateway[telegram]",
    "agentica-gateway[discord]",
    "agentica-gateway[slack]",
    "agentica-gateway[qq]",
    "agentica-gateway[wecom]",
    "agentica-gateway[dingtalk]",
    "agentica-gateway[wechat]",
]

[project.scripts]
agentica-gateway = "agentica_gateway.main:main"

[project.urls]
Homepage      = "https://github.com/shibing624/agentica"
Documentation = "https://shibing624.github.io/agentica/advanced/gateway/"
Repository    = "https://github.com/shibing624/agentica"
Issues        = "https://github.com/shibing624/agentica/issues"
Changelog     = "https://github.com/shibing624/agentica/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentica_gateway"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/agentica_gateway", "hatch_build.py", "README.md"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
