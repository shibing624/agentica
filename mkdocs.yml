site_name: Agentica
site_description: A lightweight, powerful Python framework for building autonomous AI agents
site_url: https://shibing624.github.io/agentica
repo_url: https://github.com/shibing624/agentica
repo_name: shibing624/agentica
edit_uri: blob/main/docs/

theme:
  name: readthedocs
  locale: zh
  highlightjs: true
  hljs_languages:
    - python
    - bash
    - yaml
    - json
    - shell
    - markdown
  navigation_depth: 3
  collapse_navigation: false
  titles_only: false
  sticky_navigation: true
  prev_next_buttons_location: bottom
  include_homepage_in_sidebar: true
  favicon: assets/favicon.png

nav:
  - 首页: index.md
  - 快速上手:
      - Agentica 是什么: introduction/what-is-agentica.md
      - 安装与配置: getting-started/installation.md
      - 5 分钟上手 (SDK): getting-started/quickstart.md
      - CLI 终端指南: getting-started/terminal.md
      - Web、桌面端与微信/IM: advanced/gateway.md
  - 核心用法 (Python SDK):
      - Agent 与 DeepAgent: concepts/agent.md
      - 模型与提供商: concepts/model.md
      - 工具与自定义工具: concepts/tools.md
      - 记忆与常驻规则: concepts/memory.md
      - 知识库 (RAG): concepts/rag.md
      - 存储与数据库: concepts/storage.md
  - 多智能体与协作:
      - 如何选择协作方式: multi-agent/choosing.md
      - Subagent (子任务): multi-agent/subagent.md
      - Workflow (确定性流水线): multi-agent/workflow.md
      - Swarm (多智能体自治): multi-agent/swarm.md
      - 多会话共用仓库 (Worktree): multi-agent/worktrees.md
  - 进阶功能:
      - 长任务循环 (/goal): advanced/goals.md
      - 上下文压缩 (/compact): advanced/compression.md
      - 技能系统 (Skills): advanced/skills.md
      - 定时任务 (/cron): guides/cron_scheduler.md
      - 运行预算与控制 (RunConfig): advanced/run-config.md
      - 安全护栏 (Guardrails): advanced/guardrails.md
      - 生命周期钩子 (Hooks): advanced/hooks.md
      - MCP 外部工具集成: advanced/mcp.md
      - ACP (IDE 集成): advanced/acp.md
  - 配置与参考:
      - 统一配置文件 (config.yaml): guides/config.md
      - 模型提供商速查: guides/models.md
      - OpenAI Responses API: guides/openai-responses.md
      - 最佳实践与常见配方: guides/best_practices.md
      - Agent API 参数表: api/agent.md
      - 评测对比 (Benchmark): guides/benchmark.md
  - 开发者选读 (架构与协议):
      - 架构与内部实现: introduction/architecture.md
      - 内置工具设计判据: concepts/builtin-tool-bar.md
      - 外部进程协议：Shell Hooks: getting-started/shell-hooks.md
      - 外部进程协议：Notify Sink: getting-started/notify-sink.md
      - 外部进程协议：Attach Socket: getting-started/attach.md
      - 依赖分层 RFC: rfcs/dependency-layering.md
  - Changelog 存档: changelog-archive.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
