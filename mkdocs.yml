site_name: Agentica
site_description: A lightweight, powerful Python framework for building autonomous AI agents
site_url: https://shibing624.github.io/agentica
repo_url: https://github.com/shibing624/agentica
repo_name: shibing624/agentica
edit_uri: blob/main/docs/

# Local-only research notes and scratch assets are gitignored and must never be
# published: mkdocs builds every markdown under docs/ even when it is absent
# from nav, which would put unpublished drafts into the Pages artifact and the
# search index. Keep the exclusion here as a second line of defence behind
# .gitignore, so an accidental `git add -f` cannot publish them.
exclude_docs: |
  /learn_cc/
  /tmp/

theme:
  name: material
  language: zh
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色
  icon:
    repo: fontawesome/brands/github

nav:
  - 入门:
      - 首页: index.md
      - 开始:
          - Agentica 是什么: introduction/what-is-agentica.md
          - 安装与配置: getting-started/installation.md
          - CLI 终端: getting-started/terminal.md
          - Web 与桌面端: advanced/gateway.md
          - 微信与 IM: advanced/im.md
      - 使用:
          - Schedule 提醒: getting-started/schedule.md
          - 定时任务: guides/cron_scheduler.md
          - 记忆与常驻规则: concepts/memory.md
          - 记忆 MCP: getting-started/memory-mcp.md
          - 技能: advanced/skills.md
          - 长任务: advanced/goals.md
  - 开发:
      - SDK:
          - 5 分钟上手: getting-started/quickstart.md
          - Agent 与 DeepAgent: concepts/agent.md
          - 模型与提供商: concepts/model.md
          - 工具与自定义工具: concepts/tools.md
          - 最佳实践: guides/best_practices.md
      - 集成:
          - MCP: advanced/mcp.md
          - ACP: advanced/acp.md
          - 生命周期钩子: advanced/hooks.md
          - Shell Hooks: getting-started/shell-hooks.md
          - Notify Sink: getting-started/notify-sink.md
          - Attach Socket: getting-started/attach.md
      - 多智能体:
          - Subagent: multi-agent/subagent.md
          - Worktree: multi-agent/worktrees.md
      - 运行时:
          - 上下文压缩: advanced/compression.md
          - 运行预算: advanced/run-config.md
          - 安全护栏: advanced/guardrails.md
          - Daily Tasks: advanced/daily-tasks.md
          - 多端能力对齐: advanced/surface-parity.md
  - 参考:
      - 配置文件: guides/config.md
      - 模型速查: guides/models.md
      - OpenAI Responses: guides/openai-responses.md
      - Agent API: api/agent.md
      - 架构: introduction/architecture.md
      - 内置工具判据: concepts/builtin-tool-bar.md
      - Public API: API.md
      - 评测对比: guides/benchmark.md
      - 协议:
          - 依赖分层: rfcs/dependency-layering.md
          - Thin Gateway: rfcs/thin-gateway-common-backend-api.md
      - Changelog 存档: changelog-archive.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
